[package]
name = "adnt-net-edge"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5"
tempfile = "3.10"

[dev-dependencies]
cargo-tarpaulin = "0.30"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(tarpaulin)"] }
