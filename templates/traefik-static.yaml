entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    filename: "{{DYNAMIC_PATH}}"
    watch: true

# Logging configuration for ACME monitoring
log:
  level: INFO
  format: json

accessLog:
  format: json

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{ACME_EMAIL}}"
      storage: "{{ACME_STORAGE}}"
      # Use HTTP challenge for better compatibility
      httpChallenge:
        entryPoint: web
      # Fallback to TLS challenge if needed
      # tlsChallenge: {}

# API for monitoring (optional, can be disabled in production)
api:
  dashboard: false
  insecure: false
